# Apply migration database ke Supabase secara automatik bila fail dalam supabase/migrations berubah di main.
# Perlu 3 GitHub Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  (supabase.com > Account > Access Tokens)
#   SUPABASE_PROJECT_REF   (ID projek, contoh abcdefghijklmnop)
#   SUPABASE_DB_PASSWORD   (password database yang dijana masa cipta projek)
name: Migrasi database
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.33.9
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase db push
