# Apply migration database ke Supabase secara automatik bila fail dalam supabase/migrations berubah di main.
# Perlu 3 GitHub Secrets (Settings > Secrets and variables > Actions > Repository secrets):
#   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens, bermula sbp_)
#   SUPABASE_PROJECT_REF   (ID projek, 20 aksara, contoh dari https://<ref>.supabase.co)
#   SUPABASE_DB_PASSWORD   (password database yang dijana masa cipta projek)
name: Migrasi database
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/migrate.yml']
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      # Semak & kemaskan secrets (buang ruang kosong / baris baru yang ikut semasa tampal).
      # Hanya cetak panjang dan 4 aksara pertama token, bukan nilai penuh.
      - name: Semak secrets
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          P: ${{ secrets.SUPABASE_DB_PASSWORD }}
          R: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          T="$(printf '%s' "$T" | tr -d '[:space:]')"
          P="$(printf '%s' "$P" | tr -d '\r\n')"
          R="$(printf '%s' "$R" | tr -d '[:space:]')"
          R="${R#https://}"; R="${R%%.supabase.co*}"
          echo "Token: ${#T} aksara, bermula '${T:0:7}'"
          echo "Project ref: ${#R} aksara"
          echo "Password: ${#P} aksara"
          [ -n "$T" ] || { echo "::error::SUPABASE_ACCESS_TOKEN kosong atau tiada dalam Repository secrets (bahagian Actions)."; exit 1; }
          case "$T" in sbp_*) ;; *) echo "::error::Token mesti bermula sbp_ (Personal access token dari supabase.com/dashboard/account/tokens), bukan API key projek."; exit 1;; esac
          [ -n "$P" ] || { echo "::error::SUPABASE_DB_PASSWORD kosong."; exit 1; }
          [ ${#R} -eq 20 ] || echo "::warning::Project ref biasanya 20 aksara."
          echo "::add-mask::$T"
          echo "::add-mask::$P"
          { echo "SUPABASE_ACCESS_TOKEN=$T"; echo "SUPABASE_DB_PASSWORD=$P"; echo "PROJECT_REF=$R"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest   # token jenis baru (sbp_v0_...) perlu CLI terkini
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push --include-all
