<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="logo.webp">
  <title>Laporan Kelas HYB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
:root{
  --navy:#1F377A; --brand:#2F6FC4; --brand-h:#255CA8; --accent:#E9508A; --pink-bg:#FDE6EF; --pink-tx:#B42662;
  --bg:#F3F7FC; --card:#fff; --line:#E0E8F3; --line-2:#EDF2F9; --ink:#16213F; --ink-2:#36415F; --mute:#68738F;
  --g-bg:#E1F3E7; --g-tx:#1F6B3D; --r-bg:#FDE3E1; --r-tx:#A62E22; --y-bg:#FDF1D6; --y-tx:#875A00; --b-bg:#E1EDFB; --b-tx:#2559A0;
  --display:Nunito,Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.top{background:var(--navy);color:#fff;padding:14px 16px 56px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top .logo-img{height:44px;width:auto;background:#fff;border-radius:10px;padding:3px 6px}
.top h1{font-family:var(--display);font-size:20px;margin:0;line-height:1.2}
.top p{margin:2px 0 0;color:#C9D6F2;font-size:13px}
.wrap{max-width:560px;margin:-42px auto 0;padding:0 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(31,55,122,.06),0 4px 14px rgba(31,55,122,.06)}
.card-h{padding:14px 16px 0;display:flex;align-items:center;gap:8px}
.card-h h2{font-family:var(--display);font-size:16px;margin:0;color:var(--navy)}
.card-h .c{margin-left:auto;font-size:12px;font-weight:700;background:var(--pink-bg);color:var(--pink-tx);border-radius:20px;padding:2px 9px}
.card-b{padding:12px 16px 16px}
.hai{font-size:14px;color:var(--ink-2)}
.hai b{color:var(--ink)}
.sesi{display:flex;flex-direction:column;gap:8px}
.sesi button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.sesi button:hover,.sesi button:focus-visible{border-color:var(--brand);background:#F7FAFF}
.sesi button.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--pink-bg)}
.dbox{width:46px;flex:0 0 46px;text-align:center;border-radius:9px;background:var(--r-bg);color:var(--r-tx);padding:4px 0;line-height:1.1}
.dbox b{display:block;font-size:17px;font-family:var(--display)}
.dbox span{font-size:10.5px;text-transform:uppercase;font-weight:600}
.sesi .t{min-width:0;flex:1}
.sesi .t b{display:block;font-size:14px}
.sesi .t span{font-size:12.5px;color:var(--mute)}
.sesi .go{font-size:13px;font-weight:600;color:var(--brand)}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
.fld{margin-bottom:14px}
.help{font-size:12px;color:var(--mute);margin-top:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{all:unset;cursor:pointer;font-size:12.5px;padding:4px 10px;border-radius:20px;background:var(--b-bg);color:var(--b-tx)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:13px 16px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:16px}
.btn:hover{background:var(--brand-h)}
.btn[disabled]{opacity:.6;cursor:default}
.btn.sec{background:#fff;color:var(--brand);border:1px solid var(--line)}
.err{background:var(--r-bg);color:var(--r-tx);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.ok{text-align:center;padding:26px 18px}
.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--g-bg);color:var(--g-tx);display:grid;place-items:center;margin:0 auto 12px;font-size:32px;font-weight:700}
.ok h2{font-family:var(--display);margin:0 0 6px;color:var(--navy)}
.ok p{margin:0 0 18px;color:var(--ink-2)}
.lap{list-style:none;margin:0;padding:0}
.lap li{padding:10px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.lap li:first-child{border-top:0}
.lap .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.lap .h span{color:var(--g-tx);font-weight:600;font-size:12.5px;white-space:nowrap}
.lap .s{color:var(--mute);font-size:12.5px}
.empty{color:var(--mute);font-size:13.5px}
.pesan{max-width:420px;margin:60px auto;padding:0 16px;text-align:center}
.pesan .card{padding:26px 20px}
.pesan h2{font-family:var(--display);color:var(--navy);margin:0 0 8px}
.loading{text-align:center;color:var(--mute);padding:40px 0}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 10px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;font-size:12px;color:var(--mute)}
.banner,#banner:not(:empty){background:var(--y-bg);color:var(--y-tx);font-size:12.5px;padding:8px 16px;text-align:center}
.hd-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hd-bar b{font-size:15px;color:var(--g-tx);margin-right:auto}
.hd-bar button{all:unset;cursor:pointer;font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2);background:#fff}
.hd{display:flex;flex-direction:column;gap:6px}
.hp{display:flex;align-items:center;gap:10px;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink);background:#FBFCFE}
.hp input{width:20px;height:20px;flex:0 0 20px;margin:0;accent-color:#3E8E5E}
.hp span{flex:1;min-width:0;font-size:14.5px}
.hp em{font-style:normal;font-size:12px;font-weight:600;color:var(--r-tx)}
.hp.on{background:var(--g-bg);border-color:#BFE0CA}
.hp.on em{color:var(--g-tx)}
.help.tag{color:var(--pink-tx);font-weight:600}
.spin.sm{display:inline-block;width:14px;height:14px;border-width:2px;margin:0 6px -2px 0}
  </style>
</head>
<body data-k="">
  <div id="banner"></div>
  <div class="top"><div class="top-in"><img class="logo-img" alt="Halaqah Ya Bunayya" src="logo.webp"><div><h1>Laporan Kelas</h1><p>Halaqah Ya Bunayya · Geng Ngaji Global</p></div></div></div>
  <main class="wrap" id="app"><div class="card"><div class="loading"><div class="spin"></div>Memuatkan...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=20261127"></script>
<script src="awam.js?v=20261127"></script>
<script src="guru.js?v=20261127"></script>
</body>
</html>
